[project]
name = "godot-ai"
version = "4.0.1"
description = "Production-grade MCP server and AI tools for the Godot engine"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Godot AI contributors" }]
keywords = [
    "godot",
    "godot-engine",
    "mcp",
    "model-context-protocol",
    "ai",
    "llm",
    "gamedev",
    "editor-plugin",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Framework :: AsyncIO",
]
dependencies = [
    # V4's security limits intentionally touch narrow FastMCP, Uvicorn, and
    # websockets internals. An exact godot-ai pin is not reproducible if those
    # boundaries float underneath it, so every behavior-defining distribution
    # is exact and checked again at process startup. Dependency upgrades are a
    # reviewed release change, not a resolver-time event.
    "fastmcp==3.4.7",
    # attach/proxy.py uses AnyIO's stream exceptions directly. Keep that
    # contract explicit instead of inheriting FastMCP's transitive choice.
    "anyio==4.14.2",
    "mcp==1.29.1",
    "websockets==17.1",
    "pydantic==2.13.5",
    # The attach bridge uses AsyncClient, transport errors, and granular
    # connect/read/write/pool timeouts directly. Do not rely on FastMCP's
    # transitive installation for this public runtime dependency.
    "httpx==0.28.1",
    # asgi.py imports these directly; declare them instead of relying on
    # them arriving transitively through fastmcp (audit backlog).
    "uvicorn==0.52.4",
    # Starlette < 0.40.0 is affected by CVE-2024-47874 (multipart/form-data
    # denial of service). A normal install resolves far above this (fastmcp's
    # own floor is starlette>=1.0.1), but this package's declared floor is
    # what a *constrained* resolve is allowed to pick, so it must not name a
    # version with a known advisory against it.
    "starlette==1.6.0",
    # BoundedH11Protocol inherits Uvicorn's h11 implementation directly.
    "h11==0.16.0",
]

[project.urls]
Homepage = "https://github.com/hi-godot/godot-ai"
Repository = "https://github.com/hi-godot/godot-ai"
Issues = "https://github.com/hi-godot/godot-ai/issues"
Documentation = "https://github.com/hi-godot/godot-ai#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # CI runs the suite across every runner core; the suite is safe under
    # xdist because integration fixtures allocate free ports per test.
    "pytest-xdist>=3.5",
    "hypothesis>=6.0",
    "ruff>=0.8",
    # Used by script/ci-game-capture-smoke to decode PNG frames from the
    # running game and assert the expected colored quadrants are present.
    "pillow>=10.0",
    # Reviewed harness only: identity-bound release resource measurements.
    "psutil==7.2.2",
    # The closed-editor installer (script/v4-release) verifies release
    # signatures with it. release_verify imports it lazily, so the server
    # package never loads it at runtime.
    "cryptography>=42",
]
build = [
    "build==1.6.0",
    "pyinstaller==6.22.2",
]

[project.scripts]
godot-ai = "godot_ai:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# Drop each passed test's tmp_path at teardown so a long run's basetemp stays small and fast.
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
